<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murano Avize</title>
<style>
  html,body{margin:0;height:100%;background:#14161b;color:#e8e6e1;font-family:system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;top:12px;left:12px;background:#0009;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.9}
  label{display:block;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
  <b>Bileşenler</b>
  <label><input type="checkbox" id="skel" checked> İskelet (çerçeve)</label>
  <label><input type="checkbox" id="glass" checked> Cam parçalar (prizmalar)</label>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- Parametreler (cm) ----
const ARMS = 12;          // kol sayısı
const ARM_R = 30;         // kol yarıçapı
const RING_R = 14;        // iç halka yarıçapı
const PRISMS_PER_ARM = 5; // her koldan sarkan prizma
const DROPS_RING = 24;    // halkadan sarkan prizma

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x14161b);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 1, 1000);
camera.position.set(90, 20, 110);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0, 0);
controls.enableDamping = true;
scene.add(new THREE.DirectionalLight(0xffffff, 1.5).translateX(50).translateY(80).translateZ(60));

// ---- Malzemeler ----
const metal = new THREE.MeshStandardMaterial({color:0xc9a24a, metalness:1, roughness:0.28});
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xffffff, metalness:0, roughness:0.02, transmission:1, thickness:1.2,
  ior:1.52, transparent:true, opacity:1, envMapIntensity:1.6, clearcoat:1
});
const bulbMat = new THREE.MeshStandardMaterial({color:0xfff2c8, emissive:0xffd98a, emissiveIntensity:1.5});

// ================= İSKELET =================
const skeleton = new THREE.Group(); skeleton.name = 'Iskelet';
scene.add(skeleton);

function lathe(pts, mat = metal){
  return new THREE.Mesh(new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 40), mat);
}

// Tavan başlığı (canopy) + zincir/gövde
const canopy = lathe([[0,60],[5,60],[7,58],[7,56],[3,54],[0,54]]); canopy.name='Tavan basligi';
skeleton.add(canopy);
const stem = lathe([[0,54],[1.2,54],[1.2,30],[2.5,28],[1.8,24],[3.2,20],[2,16],[0,16]]); stem.name='Ana govde';
skeleton.add(stem);

// Orta gövde (balkabağı/vazo formu)
const body = lathe([[0,16],[3,15],[6,10],[7,4],[5,-1],[3,-4],[4.5,-8],[2,-12],[0,-14]]); body.name='Orta govde';
skeleton.add(body);

// İç halka
const ring = new THREE.Mesh(new THREE.TorusGeometry(RING_R, 0.7, 12, 64), metal);
ring.rotation.x = Math.PI/2; ring.position.y = 0; ring.name='Ic halka';
skeleton.add(ring);

// Kollar: S-kıvrımlı tüp + bobeş + mum soketi + ampul
const armGroup = new THREE.Group(); armGroup.name='Kollar';
skeleton.add(armGroup);
function armCurve(){
  return new THREE.CatmullRomCurve3([
    new THREE.Vector3(5, 0, 0),
    new THREE.Vector3(12, -6, 0),
    new THREE.Vector3(20, -5, 0),
    new THREE.Vector3(26, 2, 0),
    new THREE.Vector3(ARM_R, 8, 0)
  ]);
}
const curve = armCurve();
const armGeo = new THREE.TubeGeometry(curve, 40, 0.55, 10, false);
const bobGeo = lathe([[0,0],[3.2,0],[3.8,1.2],[2.4,1.8],[1.6,2.4],[0,2.4]]).geometry;
const socketGeo = new THREE.CylinderGeometry(1.5, 1.7, 8, 16);
const bulbGeo = new THREE.SphereGeometry(1.1, 12, 12);
bulbGeo.scale(1, 1.8, 1);

const armEnds = [];
for (let i = 0; i < ARMS; i++){
  const a = i / ARMS * Math.PI * 2;
  const g = new THREE.Group(); g.name = `Kol ${i+1}`;
  g.rotation.y = a;
  const tube = new THREE.Mesh(armGeo, metal); g.add(tube);
  const end = curve.getPoint(1);
  const bob = new THREE.Mesh(bobGeo, metal); bob.position.copy(end).y -= 0.4; g.add(bob);
  const sock = new THREE.Mesh(socketGeo, metal); sock.position.copy(end).y += 5.0; g.add(sock);
  const bulb = new THREE.Mesh(bulbGeo, bulbMat); bulb.position.copy(end).y += 11; g.add(bulb);
  armGroup.add(g);
  armEnds.push({a, p: end});
}

// Alt süs (finial)
const finial = lathe([[0,-14],[1.2,-14],[1.8,-17],[0.6,-20],[0,-22]]); finial.name='Alt sus';
skeleton.add(finial);

// ================= CAM PARÇALAR =================
const glass = new THREE.Group(); glass.name = 'Cam';
scene.add(glass);

// Prizma: altıgen kesitli, sivri uçlu damla
function prismGeo(len, r){
  const pts = [[0,0],[r*0.8,0.1*len],[r,0.35*len],[r*0.85,0.85*len],[0,len]]
    .map(p => new THREE.Vector2(p[0], p[1]));
  const g = new THREE.LatheGeometry(pts, 6); // 6 yüzlü = prizma
  g.translate(0, -len, 0); g.rotateX(Math.PI);  // sivri uç aşağı
  g.computeVertexNormals();
  return g;
}
const dropGeo = prismGeo(7, 1.1);
const longGeo = prismGeo(14, 1.5);
const ballGeo = new THREE.SphereGeometry(1.2, 20, 14);

function addPrism(parent, geo, x, y, z, name){
  const m = new THREE.Mesh(geo, glassMat);
  m.position.set(x, y, z); m.name = name;
  parent.add(m);
  return m;
}

// Halkadan sarkan uzun prizmalar
const ringGlass = new THREE.Group(); ringGlass.name='Halka prizmalari'; glass.add(ringGlass);
for (let i = 0; i < DROPS_RING; i++){
  const a = i / DROPS_RING * Math.PI * 2;
  addPrism(ringGlass, longGeo, Math.cos(a)*RING_R, -1.4, Math.sin(a)*RING_R, `Halka prizma ${i+1}`);
}

// Kol uçlarından sarkan prizma çemberleri (bobeş altında)
const armGlass = new THREE.Group(); armGlass.name='Kol prizmalari'; glass.add(armGlass);
armEnds.forEach((e, k) => {
  const px = e.p.x * Math.cos(e.a), pz = -e.p.x * Math.sin(e.a);
  for (let j = 0; j < PRISMS_PER_ARM; j++){
    const b = j / PRISMS_PER_ARM * Math.PI * 2;
    addPrism(armGlass, dropGeo, px + Math.cos(b)*3.0, e.p.y - 1.6, pz + Math.sin(b)*3.0, `Kol ${k+1} prizma ${j+1}`);
  }
  addPrism(armGlass, ballGeo, px, e.p.y - 4.2, pz, `Kol ${k+1} top`);
});

// Gövde çevresindeki cam toplar ve ortadan sarkan zincir prizma
const bodyGlass = new THREE.Group(); bodyGlass.name='Govde camlari'; glass.add(bodyGlass);
for (let i = 0; i < 8; i++){
  const a = i/8*Math.PI*2;
  const b = addPrism(bodyGlass, ballGeo, Math.cos(a)*7.5, 3, Math.sin(a)*7.5, `Govde top ${i+1}`);
  b.scale.setScalar(1.6);
}
addPrism(bodyGlass, longGeo, 0, -22, 0, 'Alt uc prizma').scale.setScalar(1.6);

// ---- UI: bileşenleri aç/kapat ----
document.getElementById('skel').onchange = e => skeleton.visible = e.target.checked;
document.getElementById('glass').onchange = e => glass.visible = e.target.checked;

addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
