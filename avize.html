<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Murano Quadriedri Avize</title>
<style>
  html,body{margin:0;height:100%;background:#bfc3c8;color:#222;font-family:system-ui,sans-serif;overflow:hidden}
  #ui{position:fixed;top:12px;left:12px;background:#fffa;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.9}
  label{display:block;cursor:pointer}
</style>
</head>
<body>
<div id="ui">
  <b>Bileşenler</b>
  <label><input type="checkbox" id="skel" checked> İskelet (nikel çerçeve)</label>
  <label><input type="checkbox" id="glass" checked> Cam prizmalar (yıldız kesitli, 60 adet)</label>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
"three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

// ---- Parametreler (cm) ----
const LOBES = 5, PER = 12;          // 5 kol x 12 quadriedri = 60 prizma
const PET_D = 12, PET_R = 10;   // dış çap = 2*(12+10) = 44 cm       // yaprak dairesinin merkez uzaklığı / yarıçapı
const SPAN = 1.9;                   // kol yayı yarı açısı (rad)
const SWIRL = 0.55;                 // kolların çark gibi kayması (rad)
const STEP = 0.75;                  // her prizma bir öncekinden bu kadar (cm) aşağıda; 5 kolda aynı tekrar eder
const PRISM_L = 28;                 // cam yüksekliği 28 cm
const ARMS = 6;                                   // kısa kıvrık kollar

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfc3c8);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(35, innerWidth/innerHeight, 1, 1000);
camera.position.set(100, 30, 190);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 28, 0);
controls.enableDamping = true;
const sun = new THREE.DirectionalLight(0xffffff, 1.2); sun.position.set(50, 80, 60);
scene.add(sun);

// ---- Malzemeler ----
const nickel = new THREE.MeshStandardMaterial({color:0xc4c4c4, metalness:1, roughness:0.38});   // saten nikel
const chrome = new THREE.MeshStandardMaterial({color:0xf0f0f0, metalness:0.9, roughness:0.22});   // parlak krom
const glassMat = new THREE.MeshPhysicalMaterial({
  color:0xe6f2ec, metalness:0, roughness:0.04, transparent:true, opacity:0.34,
  ior:1.52, envMapIntensity:1.8, clearcoat:1, specularIntensity:1, depthWrite:false
});

const lathe = (pts, mat) => new THREE.Mesh(
  new THREE.LatheGeometry(pts.map(p => new THREE.Vector2(p[0], p[1])), 48), mat);

// ================= İSKELET =================
const skeleton = new THREE.Group(); skeleton.name = 'Iskelet';
scene.add(skeleton);
const add = (obj, name) => { obj.name = name; skeleton.add(obj); return obj; };

// Ölçüler (ürün sayfası): toplam yükseklik zincirle 120, gövde 56, çap 44, cam 28 x 3 cm.
// y=0 cam üst hizası; cam -28'e sarkar, gövde üst ucu +28, tavan ucu +92.
const TOP = 92, STEM_TOP = 28;

// Tavan başlığı (krom kubbe) + boyun
add(lathe([[0,TOP],[1.6,TOP],[4,TOP-1.5],[6.2,TOP-4],[7,TOP-6.5],[0,TOP-6.5]], chrome), 'Tavan kubbesi');
add(lathe([[0,TOP-6.5],[1.4,TOP-6.5],[1.4,TOP-9],[0,TOP-9]], chrome), 'Tavan boynu');

// Üst çubuk (tavan boynundan zincire)
const topRod = add(new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 7, 16), nickel), 'Ust cubuk');
topRod.position.y = TOP - 12.5;

// Zincir halkaları (dönüşümlü dik): gövde üstünden üst çubuğa kadar
const linkGeo = new THREE.TorusGeometry(0.7, 0.2, 8, 20); linkGeo.scale(1, 1.7, 1);
const chain = new THREE.Group(); chain.name = 'Zincir'; skeleton.add(chain);
const chainBottom = STEM_TOP - 0.5, chainTop = TOP - 16;
const CHAIN_LINKS = Math.round((chainTop - chainBottom) / 1.35);
for (let i = 0; i < CHAIN_LINKS; i++){
  const l = new THREE.Mesh(linkGeo, chrome);
  l.position.y = chainTop - i * (chainTop - chainBottom) / CHAIN_LINKS;
  l.rotation.y = (i % 2) * Math.PI / 2;
  chain.add(l);
}
// S şeklindeki destek teli (zincir boyunca)
const sy = chainBottom + 3;
const sWire = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3([
  new THREE.Vector3(0, sy + 16, 0), new THREE.Vector3(1.8, sy + 13, 0.3), new THREE.Vector3(-1.4, sy + 8, 0.2),
  new THREE.Vector3(1.8, sy + 3, 0.3), new THREE.Vector3(0, sy, 0)]), 40, 0.13, 8), chrome);
add(sWire, 'S tel');

// Ana gövde çubuğu: zincir bağlantısından göbeğe
add(lathe([[0,STEM_TOP],[1.5,STEM_TOP],[1.5,STEM_TOP-2],[0.9,STEM_TOP-3],[0.9,-2],[0,-2]], nickel), 'Ana govde cubugu');

// Merkez göbek: patineli nikel tüp + altında şeffaf ampuller
const patina = new THREE.MeshStandardMaterial({color:0xa8a8a8, metalness:1, roughness:0.55});
add(lathe([[0,2],[3,2],[3.2,0.5],[3.2,-2.5],[2.6,-3],[0,-3]], patina), 'Merkez gobek');
const bulbMat = new THREE.MeshPhysicalMaterial({color:0xffffff, transparent:true, opacity:0.35, roughness:0.05, depthWrite:false});
const bulbGeo = new THREE.SphereGeometry(1.6, 16, 12); bulbGeo.scale(1, 1.25, 1);
const bulb = add(new THREE.Mesh(bulbGeo, bulbMat), 'Merkez ampul'); bulb.position.y = -4.5;

// Prizma konumları: kol dairesi üzerinde; her kolda 12 prizma merdiven gibi kademeli alçalır
const petals = [];
for (let k = 0; k < LOBES; k++){
  const phi = k / LOBES * Math.PI * 2;
  petals.push({phi, cx: Math.cos(phi) * PET_D, cz: -Math.sin(phi) * PET_D});
}
function prismPos(p, j){
  const a = p.phi + SWIRL + (j / (PER - 1) - 0.5) * 2 * SPAN;
  const x = p.cx + Math.cos(a) * PET_R, z = p.cz - Math.sin(a) * PET_R;
  const y = -0.2 - STEP * j;                 // kademeli kot: kollar arası simetrik
  return {a, x, y, z};
}
// Dal teller: göbek kenarından her prizmanın askı kıskacına kadar ince nikel çubuk
const rod = (a, b, r, mat) => {
  const d = new THREE.Vector3().subVectors(b, a);
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r, d.length(), 6), mat);
  m.position.copy(a).addScaledVector(d, 0.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.normalize());
  return m;
};
const wires = new THREE.Group(); wires.name = 'Dal teller'; skeleton.add(wires);
petals.forEach((p, k) => {
  // ana dal: göbekten yaprak merkezine; ince dallar oradan her prizmaya yelpaze gibi
  const hub = new THREE.Vector3(Math.cos(p.phi) * 3.2, 0.5, -Math.sin(p.phi) * 3.2);
  const fork = new THREE.Vector3(p.cx * 0.8, 0.9, p.cz * 0.8);
  const trunk = rod(hub, fork, 0.42, nickel); trunk.name = `Ana dal ${k+1}`; wires.add(trunk);
  for (let j = 0; j < PER; j++){
    const q = prismPos(p, j);
    const tip = new THREE.Vector3(q.x, q.y + 0.9, q.z);
    const r = rod(fork, tip, 0.15, nickel); r.name = `Ince dal ${k+1}-${j+1}`; wires.add(r);
    const clip = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.9, 0.5), nickel);   // askı kıskacı
    clip.position.set(q.x, q.y + 0.45, q.z); clip.name = `Kiskac ${k+1}-${j+1}`; wires.add(clip);
  }
});

// Kıvrık kollar: gövdeden yukarı kavis yapıp aşağı bakan soket
const armCurve = new THREE.CatmullRomCurve3([
  new THREE.Vector3(0.9, 1, 0), new THREE.Vector3(3, 5, 0), new THREE.Vector3(6, 7.5, 0),
  new THREE.Vector3(9.5, 6.5, 0), new THREE.Vector3(10.5, 4, 0)]);
const armGeo = new THREE.TubeGeometry(armCurve, 32, 0.45, 10, false);
const socketGeo = lathe([[0,0],[1.5,0],[1.7,1],[1.5,5.5],[1.1,6.5],[0,6.5]], nickel).geometry;
const arms = new THREE.Group(); arms.name = 'Kollar'; skeleton.add(arms);
for (let i = 0; i < ARMS; i++){
  const g = new THREE.Group(); g.name = `Kol ${i+1}`;
  g.rotation.y = i / ARMS * Math.PI * 2 + 0.3;
  g.add(new THREE.Mesh(armGeo, nickel));
  const sock = new THREE.Mesh(socketGeo, nickel);
  sock.scale.setScalar(0.6); sock.rotation.x = Math.PI;       // aşağı bakar
  sock.position.set(10.5, 4.6, 0);
  g.add(sock);
  const ab = new THREE.Mesh(bulbGeo, bulbMat); ab.position.set(10.5, 0.6, 0); g.add(ab);
  arms.add(g);
}

// ================= CAM PRİZMALAR =================
const glass = new THREE.Group(); glass.name = 'Cam'; scene.add(glass);

// Quadriedri prizma: kıvrık içbükey kenarlı 4 kollu yıldız kesit, alt uç düz.
function prismGeo(len){
  const w = 1.5, q = 0.28;                         // kol ucu yarı mesafe (3 cm genişlik), kenar içbükeyliği
  const s = new THREE.Shape();
  s.moveTo(w, 0);
  s.quadraticCurveTo(q, q, 0, w);
  s.quadraticCurveTo(-q, q, -w, 0);
  s.quadraticCurveTo(-q, -q, 0, -w);
  s.quadraticCurveTo(q, -q, w, 0);
  const g = new THREE.ExtrudeGeometry(s, {depth: len, bevelEnabled:false, curveSegments:6});
  g.rotateX(Math.PI / 2);                         // extrude z → -y (aşağı)
  g.rotateY(0.45);                                // yıldız kolları radyal doğrultudan hafif dönük
  g.computeVertexNormals();
  return g;
}
const prism = prismGeo(PRISM_L);
petals.forEach((p, k) => {
  const g = new THREE.Group(); g.name = `Yaprak ${k+1} prizmalari`; glass.add(g);
  for (let j = 0; j < PER; j++){
    const q = prismPos(p, j);
    const m = new THREE.Mesh(prism, glassMat);
    m.position.set(q.x, q.y, q.z);
    m.rotation.y = q.a;
    m.name = `Prizma ${k+1}-${j+1}`;
    g.add(m);
  }
});

// ---- UI ----
document.getElementById('skel').onchange = e => skeleton.visible = e.target.checked;
document.getElementById('glass').onchange = e => glass.visible = e.target.checked;
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
</script>
</body>
</html>
